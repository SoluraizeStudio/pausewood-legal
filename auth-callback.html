<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pausewood</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #DCE7E0; color: #1F3A33;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: calc(100% - 32px); max-width: 440px; box-sizing: border-box;
      background: #FFFDF6; border-radius: 20px; padding: 32px 24px; text-align: center;
      box-shadow: 0 3px 0 #B9CFC4;
    }
    h1 { margin: 0 0 8px; font-size: 26px; color: #2F5A4E; }
    p { margin: 8px 0; line-height: 1.45; }
    .button {
      display: block; margin: 24px 0 8px; padding: 16px; border-radius: 16px;
      background: #2F5A4E; color: #fff; text-decoration: none; font-weight: 700; font-size: 17px;
      box-shadow: 0 3px 0 #1F3A33;
    }
    .hint { color: #5F7A70; font-size: 14px; }
    .error { color: #A3431F; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Done</h1>
    <p id="text">Tap the button to return to Pausewood and continue.</p>
    <a id="open" class="button" href="pausewood://auth-callback">Open Pausewood</a>
    <p class="hint" id="hint">If the app did not open, go back to your phone's home screen and open Pausewood yourself.</p>
  </main>

  <script>
    (function () {
      // Один язык: русский для браузера на русском, иначе английский.
      var ru = (navigator.language || "").toLowerCase().indexOf("ru") === 0;
      var text = ru ? {
        title: "Готово",
        text: "Нажмите кнопку, чтобы вернуться в Pausewood и продолжить.",
        open: "Открыть Pausewood",
        hint: "Если приложение не открылось, вернитесь на главный экран телефона и откройте Pausewood вручную.",
        errTitle: "Ссылка не сработала",
        errText: "Ссылка устарела или уже использована. Запросите новое письмо в приложении."
      } : {
        title: "Done",
        text: "Tap the button to return to Pausewood and continue.",
        open: "Open Pausewood",
        hint: "If the app did not open, go back to your phone's home screen and open Pausewood yourself.",
        errTitle: "The link did not work",
        errText: "The link has expired or was already used. Request a new email in the app."
      };
      document.documentElement.lang = ru ? "ru" : "en";

      var title = document.getElementById("title");
      var body = document.getElementById("text");
      var hint = document.getElementById("hint");
      var open = document.getElementById("open");
      title.textContent = text.title;
      body.textContent = text.text;
      open.textContent = text.open;
      hint.textContent = text.hint;

      // Код или токены приходят в адресе страницы; передаём их приложению как есть.
      var tail = window.location.search + window.location.hash;
      var link = "pausewood://auth-callback" + tail;
      open.setAttribute("href", link);

      // Ссылка устарела или уже использована: сообщаем и не зовём приложение.
      if (/[?#&]error=/.test(tail)) {
        title.textContent = text.errTitle;
        body.textContent = text.errText;
        body.className = "error";
        hint.hidden = true;
        open.hidden = true;
        return;
      }

      // Браузер часто блокирует открытие приложения без нажатия; если не заблокирует,
      // приложение откроется само, иначе остаётся кнопка.
      window.setTimeout(function () { window.location.href = link; }, 700);
    })();
  </script>
</body>
</html>
